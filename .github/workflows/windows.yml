name: Windows installer and smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:render
      - run: npm run build
      - name: Install NSIS compiler
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $compiler)) { throw 'NSIS compiler not found' }
          "MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run package:windows
      - name: Install and verify all three languages
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-ui-previews
          path: work/ui/*
          if-no-files-found: ignore
